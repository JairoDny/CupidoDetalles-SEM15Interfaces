<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFE4EC" />
      <stop offset="60%" stop-color="#FFF1F5" />
      <stop offset="100%" stop-color="#FED8E3" />
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62839" />
      <stop offset="100%" stop-color="#9E0C1B" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#D62839" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="24" fill="url(#bgGlow)"/>

  <!-- Decorative Floating Hearts in Background -->
  <g opacity="0.4">
    <path d="M120 100 C120 85, 100 80, 90 92 C80 80, 60 85, 60 100 C60 120, 90 140, 90 140 C90 140, 120 120, 120 100 Z" fill="#F497B6"/>
    <path d="M720 120 C720 108, 705 104, 697 113 C689 104, 674 108, 674 120 C674 135, 697 150, 697 150 C697 150, 720 135, 720 120 Z" fill="#FFD6E0"/>
    <path d="M740 380 C740 365, 720 360, 710 372 C700 360, 680 365, 680 380 C680 400, 710 420, 710 420 C710 420, 740 400, 740 380 Z" fill="#F497B6"/>
    <path d="M100 450 C100 435, 80 430, 70 442 C60 430, 40 435, 40 450 C40 470, 70 490, 70 490 C70 490, 100 470, 100 450 Z" fill="#FFD6E0"/>
  </g>

  <!-- Pedestal / Base Soft Shadow -->
  <ellipse cx="400" cy="480" rx="260" ry="40" fill="#2B2B2B" opacity="0.08"/>

  <!-- Main Luxury Romantic Gift Box -->
  <g filter="url(#softShadow)">
    <!-- Box Body -->
    <rect x="250" y="270" width="300" height="200" rx="16" fill="url(#boxGrad)"/>
    
    <!-- Ribbon Vertical -->
    <rect x="375" y="270" width="50" height="200" fill="url(#goldRibbon)"/>
    
    <!-- Box Lid -->
    <rect x="235" y="235" width="330" height="50" rx="12" fill="#E23648"/>
    <!-- Lid Ribbon Horizontal -->
    <rect x="235" y="247" width="330" height="26" fill="url(#goldRibbon)"/>

    <!-- Large Golden Bow on Top -->
    <g transform="translate(400, 235)">
      <!-- Left Loop -->
      <path d="M0 0 C-45 -70, -110 -50, -80 0 C-60 10, -20 5, 0 0 Z" fill="url(#goldRibbon)"/>
      <path d="M0 0 C-35 -50, -85 -35, -60 0 Z" fill="#F59E0B" opacity="0.6"/>
      <!-- Right Loop -->
      <path d="M0 0 C45 -70, 110 -50, 80 0 C60 10, 20 5, 0 0 Z" fill="url(#goldRibbon)"/>
      <path d="M0 0 C35 -50, 85 -35, 60 0 Z" fill="#F59E0B" opacity="0.6"/>
      <!-- Center Knot -->
      <circle cx="0" cy="0" r="18" fill="#FCD34D"/>
      <circle cx="0" cy="0" r="14" fill="#D97706"/>
      <!-- Ribbon Tails -->
      <path d="M-8 8 C-25 45, -50 75, -65 110 L-45 105 C-35 80, -15 50, 0 8 Z" fill="url(#goldRibbon)"/>
      <path d="M8 8 C25 45, 50 75, 65 110 L45 105 C35 80, 15 50, 0 8 Z" fill="url(#goldRibbon)"/>
    </g>
  </g>

  <!-- Red Roses Peeking Behind/Beside the Box -->
  <g transform="translate(180, 260)">
    <circle cx="40" cy="40" r="35" fill="#C1121F"/>
    <path d="M25 35 C30 20, 50 20, 55 35 C50 50, 30 50, 25 35 Z" fill="#8F0D17"/>
    <circle cx="40" cy="40" r="18" fill="#D62839"/>
    <path d="M35 38 C37 32, 43 32, 45 38 C43 44, 37 44, 35 38 Z" fill="#FFD6E0"/>
    <!-- Rose Leaves -->
    <path d="M10 55 C-5 40, -10 60, 5 70 C20 65, 15 55, 10 55 Z" fill="#2E7D32"/>
  </g>

  <g transform="translate(560, 280)">
    <circle cx="35" cy="35" r="30" fill="#D62839"/>
    <circle cx="35" cy="35" r="16" fill="#A81423"/>
    <path d="M30 32 C33 26, 38 26, 40 32 Z" fill="#FFD6E0"/>
    <path d="M55 45 C70 40, 75 55, 60 65 C48 62, 50 50, 55 45 Z" fill="#2E7D32"/>
  </g>

  <!-- Cute Teddy Bear peeking or sitting beside -->
  <g transform="translate(150, 340)">
    <ellipse cx="60" cy="90" rx="45" ry="40" fill="#C68B59"/>
    <ellipse cx="60" cy="90" rx="30" ry="26" fill="#E8C39E"/>
    <!-- Head -->
    <circle cx="60" cy="35" r="32" fill="#C68B59"/>
    <circle cx="35" cy="12" r="12" fill="#A86F3E"/>
    <circle cx="35" cy="12" r="7" fill="#E8C39E"/>
    <circle cx="85" cy="12" r="12" fill="#A86F3E"/>
    <circle cx="85" cy="12" r="7" fill="#E8C39E"/>
    <!-- Snout & Nose -->
    <ellipse cx="60" cy="42" rx="14" ry="10" fill="#E8C39E"/>
    <ellipse cx="60" cy="38" rx="6" ry="4" fill="#3E2723"/>
    <!-- Eyes -->
    <circle cx="48" cy="30" r="4" fill="#3E2723"/>
    <circle cx="49" cy="29" r="1.5" fill="#FFFFFF"/>
    <circle cx="72" cy="30" r="4" fill="#3E2723"/>
    <circle cx="73" cy="29" r="1.5" fill="#FFFFFF"/>
    <!-- Bear Bowtie -->
    <polygon points="52,58 68,58 60,65" fill="#D62839"/>
    <polygon points="52,72 68,72 60,65" fill="#D62839"/>
    <circle cx="60" cy="65" r="4" fill="#F497B6"/>
  </g>

  <!-- Romantic Sparkles and Floating Hearts around Box -->
  <g fill="#D62839">
    <!-- Heart 1 -->
    <path d="M400 130 C400 115, 375 110, 365 125 C355 110, 330 115, 330 130 C330 155, 365 180, 365 180 C365 180, 400 155, 400 130 Z" transform="scale(0.7) translate(140, 20)"/>
    <!-- Heart 2 -->
    <path d="M400 130 C400 115, 375 110, 365 125 C355 110, 330 115, 330 130 C330 155, 365 180, 365 180 C365 180, 400 155, 400 130 Z" fill="#F497B6" transform="scale(0.5) translate(800, 180) rotate(15)"/>
    <!-- Heart 3 -->
    <path d="M400 130 C400 115, 375 110, 365 125 C355 110, 330 115, 330 130 C330 155, 365 180, 365 180 C365 180, 400 155, 400 130 Z" fill="#FFD6E0" transform="scale(0.6) translate(150, 400) rotate(-20)"/>
  </g>

  <!-- Glowing Stars -->
  <polygon points="340,180 343,170 346,180 356,183 346,186 343,196 340,186 330,183" fill="#FCD34D"/>
  <polygon points="480,160 482,152 485,160 493,162 485,165 482,173 480,165 472,162" fill="#FCD34D"/>
  <polygon points="570,230 572,224 574,230 580,232 574,234 572,240 570,234 564,232" fill="#F59E0B"/>
</svg>