<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="pbg3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCD5E2"/>
    </radialGradient>
    <radialGradient id="bearFur" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E5AF81"/>
      <stop offset="70%" stop-color="#C28253"/>
      <stop offset="100%" stop-color="#A56839"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#pbg3)"/>
  <ellipse cx="200" cy="350" rx="130" ry="22" fill="#2B2B2B" opacity="0.12"/>
  <!-- Teddy Legs -->
  <ellipse cx="140" cy="320" rx="35" ry="30" fill="url(#bearFur)"/>
  <ellipse cx="140" cy="320" rx="20" ry="16" fill="#F4D3B8"/>
  <ellipse cx="260" cy="320" rx="35" ry="30" fill="url(#bearFur)"/>
  <ellipse cx="260" cy="320" rx="20" ry="16" fill="#F4D3B8"/>
  <!-- Body -->
  <ellipse cx="200" cy="245" rx="75" ry="85" fill="url(#bearFur)"/>
  <!-- Big Red Heart held by Teddy -->
  <path d="M200 205 C200 175, 150 160, 135 195 C120 230, 160 270, 200 305 C240 270, 280 230, 265 195 C250 160, 200 175, 200 205 Z" fill="#D62839"/>
  <text x="200" y="240" font-family="'Playfair Display', serif" font-weight="700" font-size="20" fill="#FFFFFF" text-anchor="middle">Te Amo</text>
  <!-- Teddy Arms hugging heart -->
  <ellipse cx="130" cy="240" rx="26" ry="40" fill="url(#bearFur)" transform="rotate(25 130 240)"/>
  <ellipse cx="270" cy="240" rx="26" ry="40" fill="url(#bearFur)" transform="rotate(-25 270 240)"/>
  <!-- Head -->
  <circle cx="200" cy="120" r="62" fill="url(#bearFur)"/>
  <!-- Ears -->
  <circle cx="150" cy="75" r="22" fill="url(#bearFur)"/>
  <circle cx="150" cy="75" r="13" fill="#F4D3B8"/>
  <circle cx="250" cy="75" r="22" fill="url(#bearFur)"/>
  <circle cx="250" cy="75" r="13" fill="#F4D3B8"/>
  <!-- Muzzle -->
  <ellipse cx="200" cy="135" rx="28" ry="20" fill="#F4D3B8"/>
  <ellipse cx="200" cy="128" rx="10" ry="7" fill="#3D2314"/>
  <path d="M200 135 L200 144 M194 144 C197 148, 203 148, 206 144" stroke="#3D2314" stroke-width="2.5" fill="none"/>
  <!-- Eyes -->
  <circle cx="178" cy="112" r="7" fill="#2B1A0E"/>
  <circle cx="180" cy="110" r="2.5" fill="#FFFFFF"/>
  <circle cx="222" cy="112" r="7" fill="#2B1A0E"/>
  <circle cx="224" cy="110" r="2.5" fill="#FFFFFF"/>
