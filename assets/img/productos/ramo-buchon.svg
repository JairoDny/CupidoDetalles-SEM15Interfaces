<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="pbg9" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FCD5E2"/>
    </radialGradient>
    <linearGradient id="roseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D"/>
      <stop offset="50%" stop-color="#D62839"/>
      <stop offset="100%" stop-color="#800A15"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#pbg9)"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="355" rx="110" ry="20" fill="#2B2B2B" opacity="0.12"/>
  <!-- Black Luxury Wrapping Paper -->
  <polygon points="120,180 280,180 230,340 170,340" fill="#18181B"/>
  <polygon points="100,160 300,160 250,220 150,220" fill="#27272A"/>
  <!-- Gold Ribbon on Wrap -->
  <rect x="180" y="270" width="40" height="15" fill="url(#goldCrown)"/>
  <polygon points="170,277 230,277 200,290" fill="url(#goldCrown)"/>
  <!-- Dense Cluster of Red Roses (Ramo Buchón) -->
  <g transform="translate(200, 150)">
    <!-- Bottom row -->
    <circle cx="-60" cy="20" r="24" fill="url(#roseRed)"/>
    <circle cx="-20" cy="25" r="26" fill="url(#roseRed)"/>
    <circle cx="20" cy="25" r="26" fill="url(#roseRed)"/>
    <circle cx="60" cy="20" r="24" fill="url(#roseRed)"/>
    <!-- Middle row -->
    <circle cx="-75" cy="-15" r="22" fill="url(#roseRed)"/>
    <circle cx="-40" cy="-10" r="26" fill="url(#roseRed)"/>
    <circle cx="0" cy="-5" r="28" fill="url(#roseRed)"/>
    <circle cx="40" cy="-10" r="26" fill="url(#roseRed)"/>
    <circle cx="75" cy="-15" r="22" fill="url(#roseRed)"/>
    <!-- Top row -->
    <circle cx="-45" cy="-45" r="22" fill="url(#roseRed)"/>
    <circle cx="-15" cy="-50" r="25" fill="url(#roseRed)"/>
    <circle cx="15" cy="-50" r="25" fill="url(#roseRed)"/>
    <circle cx="45" cy="-45" r="22" fill="url(#roseRed)"/>
    <!-- Center top -->
    <circle cx="0" cy="-70" r="22" fill="url(#roseRed)"/>
    <!-- Rose details on central rose -->
    <circle cx="0" cy="-5" r="14" fill="#C1121F"/>
    <path d="M-6 -8 C-2 -12, 4 -12, 8 -6 C8 0, -4 4, -6 -8 Z" fill="#FFD6E0" opacity="0.6"/>
  </g>
  <!-- Gold Princess Crown on top of Bouquet -->
  <g transform="translate(200, 75)">
    <polygon points="-30,15 -35,-8 -18,2 0,-15 18,2 35,-8 30,15" fill="url(#goldCrown)"/>
    <rect x="-30" y="15" width="60" height="7" rx="2" fill="url(#goldCrown)"/>
    <circle cx="-35" cy="-9" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="-16" r="4" fill="#FFFFFF"/>
    <circle cx="35" cy="-9" r="3" fill="#FFFFFF"/>
    <circle cx="0" cy="8" r="3" fill="#D62839"/>
  </g>
  <!-- Butterflies decoration -->
  <path d="M120 100 Q130 90 140 100 Q130 110 120 100" fill="#FCD34D"/>
</svg>