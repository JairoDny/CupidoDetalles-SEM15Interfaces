<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="pbg11" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3F6"/>
      <stop offset="100%" stop-color="#FED8E3"/>
    </radialGradient>
    <linearGradient id="heartBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="chocoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="100%" stop-color="#241107"/>
    </linearGradient>
    <linearGradient id="chocoMilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5332"/>
      <stop offset="100%" stop-color="#542E18"/>
    </linearGradient>
    <linearGradient id="chocoWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#pbg11)"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="350" rx="140" ry="25" fill="#2B2B2B" opacity="0.12"/>
  <!-- Heart Shaped Chocolate Box -->
  <g transform="translate(200, 215) scale(1.15)">
    <path d="M0 -75 C0 -130, -100 -140, -135 -90 C-170 -40, -160 30, -75 80 L0 145 L75 80 C160 30, 170 -40, 135 -90 C100 -140, 0 -130, 0 -75 Z" fill="url(#heartBox)"/>
    <path d="M0 -70 C0 -120, -90 -130, -120 -85 C-150 -40, -140 25, -65 70 L0 130 L65 70 C140 25, 150 -40, 120 -85 C90 -130, 0 -120, 0 -70 Z" fill="#2C0A14"/>
    <!-- Compartments & Chocolates inside -->
    <!-- Top Left -->
    <rect x="-85" y="-80" width="30" height="30" rx="6" fill="url(#chocoDark)"/>
    <path d="M-80 -70 L-60 -60" stroke="#FDE68A" stroke-width="2"/>
    <!-- Top Right -->
    <rect x="55" y="-80" width="30" height="30" rx="6" fill="url(#chocoDark)"/>
    <circle cx="70" cy="-65" r="5" fill="#D62839"/>
    <!-- Center Heart Choco -->
    <path d="M0 -60 C0 -75, -20 -75, -25 -65 C-30 -55, -20 -40, 0 -25 C20 -40, 30 -55, 25 -65 C20 -75, 0 -75, 0 -60 Z" fill="#D4AF37"/>
    <!-- Middle Row -->
    <circle cx="-50" cy="-25" r="15" fill="url(#chocoMilk)"/>
    <circle cx="-50" cy="-25" r="7" fill="#F497B6"/>
    <circle cx="50" cy="-25" r="15" fill="url(#chocoWhite)"/>
    <path d="M42 -30 Q50 -20 58 -30" stroke="#881337" stroke-width="2" fill="none"/>
    <!-- Center Row -->
    <circle cx="-80" cy="-20" r="13" fill="url(#chocoMilk)"/>
    <circle cx="80" cy="-20" r="13" fill="url(#chocoDark)"/>
    <!-- Lower Middle -->
    <rect x="-35" y="10" width="28" height="28" rx="6" fill="url(#chocoDark)"/>
    <text x="-21" y="28" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FCD34D" text-anchor="middle">♥</text>
    <rect x="7" y="10" width="28" height="28" rx="6" fill="url(#chocoMilk)"/>
    <path d="M12 24 L30 24" stroke="#FFF" stroke-width="2"/>
    <!-- Bottom Tip Choco -->
    <circle cx="0" cy="65" r="16" fill="url(#chocoWhite)"/>
    <circle cx="0" cy="65" r="5" fill="#C1121F"/>
  </g>
  <!-- Gold Ribbon around box edge -->
  <g transform="translate(60, 160) rotate(-35)">
    <rect x="0" y="0" width="10" height="70" fill="#F59E0B"/>
  </g>
</svg>