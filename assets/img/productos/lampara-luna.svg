<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="pbg10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E192B"/>
      <stop offset="100%" stop-color="#0E0C14"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FEF3C7"/>
      <stop offset="85%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="woodStand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="16" fill="url(#pbg10)"/>
  <!-- Ambient Warm Aura -->
  <circle cx="200" cy="180" r="140" fill="#FDE68A" opacity="0.15"/>
  <ellipse cx="200" cy="340" rx="110" ry="20" fill="#000000" opacity="0.5"/>
  <!-- Geometric Wooden Tripod Stand -->
  <polygon points="175,270 225,270 250,335 235,335 200,285 165,335 150,335" fill="url(#woodStand)"/>
  <polygon points="190,270 210,270 205,340 195,340" fill="#78350F"/>
  <!-- 3D Moon Sphere -->
  <circle cx="200" cy="170" r="95" fill="url(#moonGlow)"/>
  <!-- Moon Craters & Texture (Subtle) -->
  <circle cx="160" cy="140" r="18" fill="#F59E0B" opacity="0.18"/>
  <circle cx="230" cy="150" r="24" fill="#F59E0B" opacity="0.14"/>
  <circle cx="185" cy="205" r="22" fill="#F59E0B" opacity="0.16"/>
  <circle cx="220" cy="215" r="14" fill="#F59E0B" opacity="0.15"/>
  <circle cx="140" cy="190" r="12" fill="#F59E0B" opacity="0.15"/>
  <!-- Silhouette on Moon: Couple Hugging/Kissing -->
  <g transform="translate(200, 175) scale(0.9)" fill="#374151" opacity="0.75">
    <circle cx="-10" cy="-22" r="8"/>
    <circle cx="10" cy="-20" r="7.5"/>
    <path d="M-22 5 C-22 -10, -5 -12, 0 -8 C5 -12, 22 -10, 22 5 C22 25, -22 25, -22 5 Z"/>
    <path d="M-8 10 C-15 28, 15 28, 8 10 Z"/>
  </g>
  <text x="200" y="215" font-family="'Playfair Display', serif" font-weight="700" font-size="9" fill="#1F2937" opacity="0.8" text-anchor="middle">Hasta la Luna y más allá</text>
</svg>